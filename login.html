<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Court Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
        }
        .login-box {
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
        }
        .login-box::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            z-index: -1;
            border-radius: 18px;
            opacity: 0.3;
            filter: blur(10px);
        }
        .login-box h1 {
            margin-bottom: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        #login-error {
            color: var(--accent);
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
            background: rgba(244, 63, 94, 0.1);
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="glass-panel login-box animate-fade-in">
            <h1><i class="fa-solid fa-scale-balanced" style="background: none; -webkit-text-fill-color: var(--primary);"></i> AI Court System</h1>
            <p style="color: var(--text-muted); margin-bottom: 2rem;">Sign in with your role-based account</p>
            
            <form id="login-form">
                <div id="login-error"></div>
                
                <div class="input-group" style="text-align: left;">
                    <label for="role">Select Your Role</label>
                    <select id="role" required>
                        <option value="Admin">Administrator (admin)</option>
                        <option value="Judge">Judge (judge_smith)</option>
                        <option value="Lawyer">Lawyer (lawyer_wick)</option>
                        <option value="Clerk">Clerk (clerk_lee)</option>
                    </select>
                </div>

                <div class="input-group" style="text-align: left;">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Username" required>
                </div>
                
                <div class="input-group" style="text-align: left;">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" value="password" required>
                </div>
                
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem; justify-content: center;">
                    Sign In <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>
            
            <p style="margin-top: 1.5rem; font-size: 0.85rem; color: var(--text-muted);">
                Hint: Password is 'password' for all accounts.
            </p>
        </div>
    </div>
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
