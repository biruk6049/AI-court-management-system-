<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cases - AI Court Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="dashboard.html" class="brand">
                <i class="fa-solid fa-scale-balanced"></i>
                Astraea AI
            </a>
            <ul class="nav-links">
                <li><a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                <li><a href="cases.html" class="active"><i class="fa-solid fa-folder-open"></i> Cases</a></li>
                <li><a href="schedule.html"><i class="fa-regular fa-calendar-days"></i> Schedule</a></li>
                <li><a href="documents.html"><i class="fa-solid fa-file-invoice"></i> Documents</a></li>
                <li><a href="ai-assistant.html"><i class="fa-solid fa-robot"></i> AI Assistant</a></li>
                <li><a href="analytics.html"><i class="fa-solid fa-chart-line"></i> Analytics</a></li>
            </ul>

            <div class="sidebar-footer">
                <a href="#" id="logout-btn"
                    style="color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1rem; border-radius: 12px; transition: 0.3s; background: rgba(244,63,94,0.1); margin-top: 0.5rem;">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-header">
                <div>
                    <h1 class="header-title">Cases Directory</h1>
                    <p style="color: var(--text-muted)">Manage and search for legal records</p>
                </div>
                <div class="header-actions">
                    <button id="theme-toggle" class="theme-toggle">
                        <i class="fa-solid fa-sun"></i>
                    </button>
                    <div class="notification-bell">
                        <i class="fa-solid fa-bell"></i>
                        <span class="notification-badge">3</span>
                    </div>
                    <div class="user-profile">
                        <div class="user-avatar">US</div>
                        <span class="user-name">User Name</span>
                    </div>
                </div>
            </header>

            <div class="glass-panel animate-fade-in">
                <div class="d-flex justify-between align-center mb-2 flex-wrap gap-1">
                    <div class="d-flex gap-1 flex-wrap" style="flex: 1">
                        <div class="input-group" style="margin-bottom: 0; width: 300px;">
                            <input type="text" id="smart-search" placeholder="Smart Search (ID, Title, Judge, Type)...">
                        </div>
                        <div class="input-group" style="margin-bottom: 0; width: 150px;">
                            <select id="filter-status">
                                <option value="">All Status</option>
                                <option value="Active">Active</option>
                                <option value="Pending">Pending</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>
                        <div class="input-group" style="margin-bottom: 0; width: 150px;">
                            <select id="filter-priority">
                                <option value="">All Priority</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn-primary clerk-only" onclick="App.openModal('new-case-modal')"><i
                            class="fa-solid fa-plus"></i> New Case</button>
                </div>

                <div class="table-responsive">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Case ID</th>
                                <th>Title</th>
                                <th>Type</th>
                                <th>Priority</th>
                                <th>Judge</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="cases-list">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modals -->
    <div id="new-case-modal" class="modal">
        <div class="glass-panel modal-content">
            <div class="d-flex justify-between align-center mb-2">
                <h3>Create New Case</h3>
                <i class="fa-solid fa-xmark cursor-pointer" onclick="App.closeModal('new-case-modal')"></i>
            </div>
            <form id="new-case-form">
                <div class="input-group">
                    <label>Case Title</label>
                    <input type="text" id="new-title" placeholder="e.g. State vs. John Doe" required>
                </div>
                <div class="d-flex gap-1">
                    <div class="input-group" style="flex: 1">
                        <label>Case Type</label>
                        <select id="new-type">
                            <option>Criminal</option>
                            <option>Civil</option>
                            <option>Probate</option>
                        </select>
                    </div>
                    <div class="input-group" style="flex: 1">
                        <label>Judge</label>
                        <select id="new-judge">
                            <option>Hon. Smith</option>
                            <option>Hon. Davis</option>
                            <option>Hon. Miller</option>
                        </select>
                    </div>
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <textarea id="new-desc" rows="3" placeholder="Enter case details..."></textarea>
                </div>
                <div class="d-flex gap-1 justify-end">
                    <button type="button" class="btn-secondary"
                        onclick="App.closeModal('new-case-modal')">Cancel</button>
                    <button type="submit" class="btn-primary">Generate Case ID & Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cases.js"></script>
</body>

</html>
